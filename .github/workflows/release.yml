name: 构建并发布安装包

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.1 这样的 tag 时自动触发
  workflow_dispatch:  # 也支持手动在 GitHub Actions 页面触发

jobs:
  # ────────────────────────────────────────────
  # Linux 打包：生成 .deb 和 .rpm
  # ────────────────────────────────────────────
  build-linux:
    name: Linux 打包
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm                  # 【关键修复】打包 rpm 必须要有这个工具

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 打包（deb + rpm，跳过 AppImage）
        run: npm run tauri build -- --bundles deb,rpm

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  # ────────────────────────────────────────────
  # Windows 打包：生成 .msi 和 .exe（NSIS）
  # ────────────────────────────────────────────
  build-windows:
    name: Windows 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 准备内置 MinGW 工具链（GCC 15）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 固定 GCC 15 系列：选手常用版本的同一档，且与洛谷（GCC 15.3）接近
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/brechtsanders/winlibs_mingw/releases?per_page=40"
          $release = $releases | Where-Object { $_.tag_name -match '^15\.' } | Select-Object -First 1
          if (-not $release) { throw "没有找到 GCC 15 系列的 winlibs 发布" }

          $asset = $release.assets | Where-Object {
              $_.name -match 'x86_64.*posix.*ucrt.*\.7z$' -and $_.name -notmatch 'llvm'
          } | Select-Object -First 1
          if (-not $asset) { throw "没有找到合适的 7z 资产（x86_64 / posix / ucrt / 不含 LLVM）" }

          Write-Host "下载 $($asset.name)（$([math]::Round($asset.size/1MB)) MB）"
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/toolchain" | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "src-tauri/resources/toolchain/toolchain.7z"

          # 不再解压进安装包：只放这一个 7z，首次启动时由应用解压到数据目录。
          # 这样安装包从 ~150MB 降到 ~15MB，打包也从十几分钟降到一两分钟。
          $mb = (Get-Item "src-tauri/resources/toolchain/toolchain.7z").Length / 1MB
          Write-Host ("工具链压缩包: {0:N1} MB" -f $mb)

      - name: 打包 Windows（msi + nsis）
        run: npm run tauri build -- --bundles msi,nsis

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ────────────────────────────────────────────
  # 发布 Release：tag 触发时自动创建
  # ────────────────────────────────────────────
  release:
    name: 发布 GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # 【点赞】这是非常正确的一步，允许 Action 往仓库写 Release
    steps:
      # 需要提交历史来生成「本版改动」，默认浅克隆拿不到 tag
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v4

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          {
            echo "## 下载哪个"
            echo
            echo "| 平台 | 文件 |"
            echo "| --- | --- |"
            echo "| **Windows（推荐）** | \`icnana_${VER}_x64-setup.exe\` — 安装时可自选目录，内置 GCC |"
            echo "| Windows（MSI） | \`icnana_${VER}_x64_en-US.msi\` — 企业分发用 |"
            echo "| **Linux** | \`.deb\` / \`.rpm\` — 依赖系统 \`g++\`，装包时会自动拉 |"
            echo
            echo "> Windows 首次启动会把内置 GCC 解压到程序目录（约 500MB，20–40 秒），之后不再重复。"
            echo "> 装到可写目录时，题目和样例就存在程序旁边的 \`workspace/\`，整个文件夹可以拷走。"
            echo
            echo "## 本版改动"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}" \
                | grep -v '^- chore: 版本号' || true
              echo
              echo "**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "首个版本。"
            fi
          } > RELEASE_NOTES.md

          echo "----- 生成的说明 -----"
          cat RELEASE_NOTES.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ICnana ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            linux-packages/**/*.deb
            linux-packages/**/*.rpm
            windows-packages/**/*.msi
            windows-packages/**/*.exe